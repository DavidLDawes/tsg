<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Globetrotter - Countries</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    /* The WebGPU canvas (3D) sits under the UI canvas (2D + input). */
    #gpu, #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    #game { outline: none; }
    #status {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #ccc; font: 16px system-ui, sans-serif; pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="gpu"></canvas>
  <canvas id="game" tabindex="0"></canvas>
  <div id="status">Loading the countries viewer…</div>
  <script src="wasm_exec.js"></script>
  <script src="globetrotter.js"></script>
  <script src="webgpu.js"></script>
  <script>
    (async () => {
      // The countries viewer (cmd/webcountries); the page is index.html's,
      // loading countries.wasm. WebGPU draws the globe when the browser
      // supports it; otherwise (or with ?renderer=canvas) everything is
      // drawn with Canvas2D. ?style=satellite starts in the satellite style.
      const forceCanvas = new URLSearchParams(location.search).get("renderer") === "canvas";
      const gpuCanvas = document.getElementById("gpu");
      window.globetrotterUseGPU = !forceCanvas && await GlobetrotterGPU.init(gpuCanvas);
      if (!window.globetrotterUseGPU) gpuCanvas.remove();
      const go = new Go();
      const r = await WebAssembly.instantiateStreaming(fetch("countries.wasm"), go.importObject);
      go.run(r.instance);
    })().catch((e) => { document.getElementById("status").textContent = "Failed to load: " + e; });
  </script>
</body>
</html>
